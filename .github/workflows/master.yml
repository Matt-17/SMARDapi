name: Master build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:
    inputs:
      run-smoke-tests:
        description: Run live SMARD smoke tests
        required: false
        default: false
        type: boolean

jobs:
  build:
    env:
      BUILD_CONFIG: Release
      SOLUTION: SMARDapi.sln

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore $SOLUTION

      - name: Build
        run: dotnet build $SOLUTION --configuration $BUILD_CONFIG --no-restore

      - name: Run tests
        run: dotnet test $SOLUTION --configuration $BUILD_CONFIG --no-restore --no-build --verbosity normal

      - name: Run smoke tests
        if: github.event_name == 'workflow_dispatch' && inputs['run-smoke-tests']
        env:
          SMARDAPI_RUN_SMOKE_TESTS: 1
        run: dotnet test SMARDapi.Tests/SMARDapi.Tests.csproj --configuration $BUILD_CONFIG --no-restore --filter TestCategory=Smoke --verbosity normal
